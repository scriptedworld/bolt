[package]
name = "bolt"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Runs a jig over a directory and records what happened."

[dependencies]
globset = "0.4"
ignore = "0.4"
# FR-4.12e kills a timed-out command's whole process group, and `kill(-pid)` is
# the only way to reach it: `Child::kill` signals the child alone and leaves
# whatever it spawned running. Declarations only, so NFR-12.4's no-C-toolchain
# constraint is untouched: nothing here is compiled by a C compiler, and std
# already links the platform libc on every target bolt builds for.
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wrench = { version = "0.1.0", path = "../wrench/rust" }

[dev-dependencies]
# Fixture trees. Every test builds a directory to walk, and a run writes into
# the tree it was pointed at, so a test that reused one would read the last
# one's evidence.
tempfile = "3"

[lints.rust]
# Dead code is a warning by default and the gate turns warnings into failures,
# so Rust needs no counterpart to Python's vulture task.
missing_docs = "warn"

[lints.clippy]
# The gate runs clippy with -D warnings, so a lint set here is a lint enforced.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
# One file that runs where it is put. NFR-12.4 wants no C toolchain in the
# picture, which Rust does not give for free the way CGO_ENABLED=0 does, and
# NEXT_STEPS records that as a decision rather than a detail.
strip = true
