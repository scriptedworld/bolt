# bolt.rust-quality.yaml, bolt's own gate, run by bolt.
#
# This is the project's own jig, standing in for two shared definitions that do
# not exist yet: a common one and a rust-std one. It is written in the format
# the rebuilt bolt reads, not the retired one toolbox's jigs are still in.
#
# WHICH SHARED DEFINITION EACH TASK WILL BELONG TO, so a later port knows what
# to delete from here rather than guessing:
#
#     common-quality      traceability, suppressions, complexity
#     rust-std-quality    format, lint, build, tests, coverage, vuln, licences
#
# WHAT THE STANDARD IS. Taken from toolbox's Python jig, which is the written
# statement of what should be validated for every language:
#
#     shape         a formatter that reports without writing, and a linter
#     correctness   types, and a test suite with coverage
#     security      known vulnerabilities, and the pragmas that silence them
#     hygiene       dead code, documentation coverage, complexity
#
# WHERE RUST DIFFERS FROM PYTHON, and it is not laziness where a task is absent:
#
#   types        the compiler does it. There is no mypy-shaped task because
#                there is no mypy-shaped gap; `cargo build` failing IS the
#                type check.
#   dead code    `dead_code` is a rustc warning and the lint task turns
#                warnings into failures, so there is no vulture counterpart.
#                Proven while writing this: an unused constant in the skeleton
#                failed the lint task before anything else was written.
#   docstrings   `missing_docs` is a lint in Cargo.toml rather than a tool, so
#                interrogate has no counterpart either. What is lost is the
#                NUMBER: interrogate reports coverage as a percentage and this
#                reports pass or fail. Worth revisiting if the number is wanted.
#   unused deps  cargo-udeps would be the task. FACT 2026-08-27: it is not
#                installed, and `requires` refuses a run naming a tool that is
#                not there, so it is named here in a comment and nowhere else.
#
# COMPLEXITY SHELLS LIZARD AND WILL NOT ALWAYS. lizard parses Rust, measured
# 2026-08-27: it reported one function at CCN 2 from a probe file. helga
# replaces it when helga exists, and what helga becomes is silo's to direct.
# NEXT_STEPS.md records the swap as owed and states what this gate needs from
# whatever runs the task, which is a tool that parses the language and
# thresholds bolt can state.
#
# Ordered cheapest first, so a failure surfaces before the slow checks run.
#
# A path that travels with this file resolves against {config_dir}. A path
# belonging to the project being checked stays relative to the base, where the
# command already stands.

requires:
  - sh
  - cargo
  - rustfmt
  - lizard
  - python3

definitions:
  requirements: REQUIREMENTS.md
  # Not the compiler's default of 0. A gate that fails on the first warning is
  # what makes `dead_code` and `missing_docs` load-bearing rather than advisory.
  deny: warnings

tasks:
  # ---- shape ----------------------------------------------------------------

  # --check reports without writing. A formatter that reformats during a check
  # is a check with a side effect, and in CI it produces a green run against a
  # tree nobody has seen.
  - name: format
    description: every file is rustfmt clean
    command: cargo fmt --check

  # --all-targets reaches tests and benches, not only the binary. Without it a
  # test file can carry anything and the gate stays green.
  - name: lint
    description: clippy, with warnings refused
    command: cargo clippy --all-targets -- -D {deny}

  # ---- correctness ----------------------------------------------------------

  # There is no separate type task. The compiler is the type checker, so this
  # failing is what mypy failing would be in the Python jig.
  - name: build
    description: every target compiles
    command: cargo build --all-targets

  - name: tests
    description: the suite, with a coverage profile addressed into the work directory
    command: >-
      cargo llvm-cov --all-targets --lcov
      --output-path {work_dir}/coverage.lcov
    evidence:
      - coverage.lcov

  # ---- security -------------------------------------------------------------

  # Advisories against what is actually in the lockfile.
  - name: vuln
    description: no dependency carries a known advisory
    command: cargo audit

  # Licences, duplicate versions and source registries. Separate from vuln
  # because it answers a different question and fails for different reasons.
  - name: licences
    description: dependency licences and sources are permitted
    command: cargo deny check

  # ---- the common tasks, which are not Rust's -------------------------------

  # THE CHECKER IS NOT BOLT'S FILE. `bin/test-traceability.py` is a symlink to
  # `toolbox/bin/test-traceability.py`, which is how a project adopts a shared
  # checker. Editing it here edits toolbox, and the change can be committed from
  # nowhere on this side of the link.
  #
  # A requirements document nobody is held to becomes decoration. Both
  # directions fail: a test citing nothing, and a settled requirement no test
  # cites.
  - name: traceability
    description: every test cites what it discharges, and every settled requirement has one
    command: python3 {config_dir}/bin/test-traceability.py --requirements {requirements} .

  # Cyclomatic complexity, function length and parameter count. The thresholds
  # are toolbox's common jig's: 15, 60 lines, 5 parameters.
  - name: complexity
    description: no function over complexity 15, 5 parameters or 60 lines
    command: lizard --CCN 15 --length 60 --arguments 5 --warnings_only src
