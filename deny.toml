# cargo-deny's policy, read by the `licences` task in toolbox's
# bolt.rust-std-quality.yaml, which this repository adopts as a link.
#
# Without this the check fails on bolt's own Apache-2.0 licence, because an
# empty allow list allows nothing, which is the tool working as intended.

# The targets bolt is built for. Without this cargo-deny reads every target's
# dependencies, including ones that never reach a binary here.
#
# This does not hide an inconvenient licence. `r-efi` is LGPL-2.1-or-later and
# reaches this tree only through a wasi and uefi path;
# `cargo tree --target x86_64-unknown-linux-gnu` contains it zero times. A
# licence that does not ship is not one bolt is under. Scoping the targets says
# so, where an allow entry would have claimed the opposite.
[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-musl" },
]

[licenses]
# NFR-12.3 says bolt is Apache-2.0. It is in the list below because cargo-deny
# checks the whole graph including the root crate.
#
# The rest are what a permissively licensed Rust dependency tree carries in
# practice, and every one of them permits redistribution in a binary without
# imposing terms on what links it.
allow = [
    "MIT",
    # MIT without the attribution clause, so strictly more permissive than the
    # line above. Reaches bolt through jsonschema, which is wrench's.
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    # A public domain dedication. BurntSushi's crates are dual Unlicense OR MIT
    # and the walk and the glob matching are both his, so either line covers
    # them; both are listed because cargo-deny reports the pair.
    "Unlicense",
    "Unicode-3.0",
    "Zlib",
]
# An allowed licence no crate in the graph carries is not an error. The list
# above is a policy, not an inventory of what the graph holds today.
unused-allowed-license = "allow"

# A crate that names only a licence file, with no licence expression, fails
# toolbox's licences task until somebody has read the file, because
# cargo-deny matches the text rather than reading it. A clarify is the record
# of that reading, and its hash pins the text that was read, so a release that
# changes the file fails again until it is read again. The ruling is silo's
# docs/DECISIONS/a-licence-file-crate-is-read-before-it-passes.md.
#
# libyaml-safer reaches bolt through wrench. Its LICENSE-MIT in 0.3.0 is MIT's
# grant and conditions word for word. The hash is XXH32 of the file with CRLF
# turned to LF, which is how cargo-deny hashes it.
[[licenses.clarify]]
crate = "libyaml-safer"
expression = "MIT"
license-files = [{ path = "LICENSE-MIT", hash = 0x386ca1bc }]

[bans]
# Two versions of one crate is usually a lockfile that has not been reconciled,
# and it doubles what a vulnerability check has to reason about. It warns and
# does not fail, because a transitive duplicate is often not the adopter's to
# fix.
multiple-versions = "warn"
wildcards = "deny"

[advisories]
# The `vuln` task runs `cargo audit`, which is the tool that owns this question.
# Advisories stay on here as well, deliberately: the two read the same database,
# and a disagreement between them is something to look into.
yanked = "deny"

[sources]
# Anything not from crates.io is named explicitly or it does not build.
unknown-registry = "deny"
unknown-git = "deny"
